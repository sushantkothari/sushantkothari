name: 💬 Dynamic Dev Quote Generator

on:
  schedule:
    - cron: "0 */3 * * *"   # every 3 hours
  workflow_dispatch:

jobs:
  update-quote:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Bust cache and update Vercel quote SVG in README
        run: |
          python3 - <<'EOF'
          import time, re

          timestamp = int(time.time())
          block = f'<p align="center">\n  <img src="https://quotes-github-readme.vercel.app/api?type=horizontal&theme=tokyonight&cache_seconds=0&t={timestamp}" alt="Dev Quote" />\n</p>'

          with open("README.md", "r", encoding="utf-8") as f:
              content = f.read()

          pattern = r'(<!--START_QUOTE-->).*?(<!--END_QUOTE-->)'
          replacement = f'<!--START_QUOTE-->\n{block}\n<!--END_QUOTE-->'
          new_content = re.sub(pattern, replacement, content, flags=re.DOTALL)

          with open("README.md", "w", encoding="utf-8") as f:
              f.write(new_content)

          print(f"Busted quote cache with timestamp: {timestamp}")
          EOF

      - name: Commit updated README
        run: |
          git config --global user.email "action@github.com"
          git config --global user.name "GitHub Action"
          git add README.md
          git diff --staged --quiet || git commit -m "ci: update dynamic quote cache buster"
          git push
